# Render Blueprint: panoul Echo (serviciu web gratuit) + Postgres gratuit, Frankfurt.
# Pornirea aplică migrările, creează contul demo dacă baza e goală și pornește workerul în același proces.
services:
  - type: web
    name: echo-ai
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: bash scripts/render-start.sh
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: echo-db
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: CATALOG_SYNC_HOURS
        value: "24"
      - key: TRUST_SCORE_PUBLIC
        value: "0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
databases:
  - name: echo-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
