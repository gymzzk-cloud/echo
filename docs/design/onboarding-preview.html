<title>Echo onboarding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: Echo panel shell. Stepper left (top on phone), one task per screen, sticky action bar. Tokens copied from src/app/globals.css */
:root{
  --bg:#ffffff;--surface:#f7f9f8;--border:#e1e8e6;--text:#13231f;--muted:#5b6d68;
  --primary:#0d7a6a;--primary-fg:#ffffff;--primary-bg:#dff2ee;
  --good:#1f8a4c;--good-bg:#e3f4ea;--warn:#b4610f;--warn-bg:#fdf0de;--bad:#b23b3b;--bad-bg:#fbe3e3;
  --side:#13231f;--side-fg:#e4ecea;--side-muted:#93a6a1;--side-active:#24332f;
  --ai1:#2f6f5e;--ai2:#3b63c4;--ai3:#b5643a;--ai4:#1c8a9a;
  --chart-2:#8a9a96;--chart-3:#a9b6b3;--chart-4:#c4cecb;--sea:#eaf2f0;--land:#d5dfdc;
  --display:"Sora","Inter",ui-sans-serif,system-ui,sans-serif;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16211e;--surface:#0f1715;--border:#24332f;--text:#e4ecea;--muted:#93a6a1;
  --primary:#4cc3ad;--primary-fg:#0f1715;--primary-bg:#16332d;
  --good:#5fcf8e;--good-bg:#143322;--warn:#e3a35a;--warn-bg:#3a2a17;--bad:#e37d7d;--bad-bg:#3a1a1a;
  --side:#0b1210;--side-fg:#e4ecea;--side-muted:#93a6a1;--side-active:#1c2a26;
  --chart-2:#6f817c;--chart-3:#55665f;--chart-4:#3f4e4a;--sea:#0c1513;--land:#22312d;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16211e;--surface:#0f1715;--border:#24332f;--text:#e4ecea;--muted:#93a6a1;
  --primary:#4cc3ad;--primary-fg:#0f1715;--primary-bg:#16332d;
  --good:#5fcf8e;--good-bg:#143322;--warn:#e3a35a;--warn-bg:#3a2a17;--bad:#e37d7d;--bad-bg:#3a1a1a;
  --side:#0b1210;--side-fg:#e4ecea;--side-muted:#93a6a1;--side-active:#1c2a26;
  --chart-2:#6f817c;--chart-3:#55665f;--chart-4:#3f4e4a;--sea:#0c1513;--land:#22312d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--surface);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.01em;line-height:1.2}
h2{font-size:16px;font-weight:600}
p{margin:0}
.label{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .xs{font-size:12px} .num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}

.banner{background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:500;text-align:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-bottom:1px solid var(--border);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:16px}
.logo i{width:24px;height:24px;border-radius:8px;background:var(--primary);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:7px;border:2px solid var(--primary-fg);border-radius:50%}
.shell{display:grid;grid-template-columns:1fr;max-width:1152px;margin:0 auto;gap:24px;padding-block:24px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:1024px){.shell{grid-template-columns:232px minmax(0,1fr);gap:32px;padding-block:32px 120px}}

/* stepper */
.steps{display:flex;gap:8px;overflow-x:auto;list-style:none;margin:0;padding:0 0 4px}
.steps li{flex:0 0 auto}
.steps button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;min-height:36px}
.steps button:hover{background:var(--bg)}
.steps .dot{width:24px;height:24px;border-radius:999px;border:1px solid var(--border);display:grid;place-items:center;font-size:12px;background:var(--bg);flex:0 0 auto}
.steps .on button{color:var(--text);background:var(--bg);box-shadow:inset 0 0 0 1px var(--border)}
.steps .on .dot{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.steps .done .dot{background:var(--primary-bg);color:var(--primary);border-color:transparent}
@media(min-width:1024px){.steps{flex-direction:column;position:sticky;top:24px;align-self:start;overflow:visible}.steps button{width:100%;box-sizing:border-box}}

.main{min-width:0;display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-direction:column;gap:8px}
.head p{color:var(--muted);font-size:16px;max-width:62ch}
.card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media(min-width:640px){.card{padding:24px}}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid2{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:768px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:768px){.grid3{grid-template-columns:repeat(3,1fr)}}

.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-weight:500;min-height:20px}
.input,.textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0 12px;height:44px;width:100%}
.textarea{height:auto;padding:10px 12px;resize:vertical;min-height:72px;line-height:1.5}
.input:focus,.textarea:focus{outline:none;border-color:var(--primary)}
@media(min-width:640px){.input{height:40px}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{line-height:18px}
.btn{font:inherit;font-weight:500;cursor:pointer;border-radius:8px;height:44px;padding:0 16px;border:1px solid var(--border);background:var(--bg);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
@media(min-width:640px){.btn{height:40px}}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{color:var(--primary);font-weight:500;cursor:pointer;background:none;border:0;font:inherit;padding:0}

.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.b-good{background:var(--good-bg);color:var(--good);border-color:transparent}
.b-warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.b-bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.b-primary{background:var(--primary-bg);color:var(--primary);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:0 12px;min-height:32px;border:1px solid var(--border);background:var(--bg);font:inherit;color:var(--text);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-bg);color:var(--text)}
.chip .x{color:var(--muted);font-size:16px;line-height:1}
.chip small{color:var(--muted);font-size:12px}
.notice{border-radius:8px;padding:12px 16px;font-size:13px}
.n-warn{background:var(--warn-bg);color:var(--warn)} .n-good{background:var(--good-bg);color:var(--good)} .n-info{background:var(--primary-bg);color:var(--text)}
.why{border:1px dashed var(--border);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.why b{color:var(--text);font-weight:600}
.src{font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.02em}

/* action bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--border);z-index:5;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1152px;margin:0 auto;display:flex;gap:8px;align-items:center;justify-content:space-between}
.bar-info{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis}
@media(max-width:639px){.bar-info{display:none}.bar-in .btn.primary{flex:1}}

/* scan */
.scan-wrap{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:1024px){.scan-wrap{grid-template-columns:minmax(0,1fr) 300px}}
.feed{display:flex;flex-direction:column}
.find{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding-block:12px;border-top:1px solid var(--border);animation:in .35s ease both}
.find:first-child{border-top:0}
.ic{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:600;flex:0 0 auto;line-height:1}
.ic.ok{background:var(--good-bg);color:var(--good)} .ic.w{background:var(--warn-bg);color:var(--warn)} .ic.run{background:var(--primary-bg);color:var(--primary)}
.find h3{font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.find{animation:none}.pulse{animation:none!important}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.big{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:4px}
.progress{height:8px;border-radius:999px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);width:0;transition:width .4s}

/* profile */
.prow{display:grid;grid-template-columns:1fr;gap:8px;padding-block:16px;border-top:1px solid var(--border)}
.prow:first-of-type{border-top:0;padding-top:0}
@media(min-width:768px){.prow{grid-template-columns:200px minmax(0,1fr);gap:24px}}
.prow .lbl{display:flex;flex-direction:column;gap:2px}
.prow .lbl b{font-weight:600}

/* markets */
.mk{text-align:left;font:inherit;color:var(--text);display:flex;flex-direction:column;gap:12px;border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;background:var(--bg)}
.mk[aria-pressed="true"]{border:2px solid var(--primary);padding:15px}
.mk .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mk .t b{font-size:16px}
.map{width:100%;height:auto;max-width:100%}
.map path{fill:var(--chart-4);stroke:var(--bg);stroke-width:2;transition:fill .2s}
.map path.on{fill:var(--primary)}
.map text{fill:var(--text);font:600 12px var(--sans)}
.map text.on{fill:var(--primary-fg)}

/* mix */
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--bg);color:var(--text);font:inherit;cursor:pointer}
.opt[aria-pressed="true"]{border:2px solid var(--primary);padding:15px}
.opt b{font-weight:600}
.srcrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--border)}
.srcrow:first-child{border-top:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.stepper button{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;font-size:16px;color:var(--muted)}
.stepper button:hover{background:var(--surface)}
.stepper span{min-width:36px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%;transition:flex-grow .3s}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.engine{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--border)}
.engine:first-child{border-top:0}
.sw{all:unset;cursor:pointer;width:36px;height:20px;border-radius:999px;background:var(--border);position:relative;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--bg);transition:left .2s}
.sw[aria-checked="true"]{background:var(--primary)}
.sw[aria-checked="true"]::after{left:18px}
.sw:disabled{opacity:.4;cursor:not-allowed}
.cost{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:768px){.cost{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* list */
.topics{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:1024px){.topics{grid-template-columns:220px minmax(0,1fr)}}
.tlist{display:flex;flex-direction:column;gap:2px}
.tlist button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:8px}
.tlist button[aria-pressed="true"]{background:var(--primary-bg);font-weight:600}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding-block:12px;border-top:1px solid var(--border);align-items:center}
.q:first-child{border-top:0}
.q .t{font-weight:500;overflow-wrap:anywhere}
.q .meta{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/2}
.q .acts{grid-row:1/3;grid-column:2;align-self:center}
.icon-btn{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted);font-size:18px}
.icon-btn:hover{background:var(--surface);color:var(--bad)}

/* run */
.eng-run{display:grid;grid-template-columns:120px minmax(0,1fr) 72px;gap:12px;align-items:center;padding-block:8px}
.ticker{display:flex;flex-direction:column;max-height:320px;overflow:auto}
.tk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding-block:8px;border-top:1px solid var(--border);animation:in .3s ease both}
.tk:first-child{border-top:0}
.tk .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* teaser */
.kpis{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:768px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi.lock .big{filter:blur(6px);user-select:none}
.bars{display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:8px;border-bottom:1px solid var(--border)}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bars .b i{display:block;width:100%;max-width:48px;border-radius:6px 6px 0 0;background:var(--chart-3)}
.bars .b.me i{background:var(--primary)}
.bars .b span{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.bnames{display:flex;gap:12px}
.bnames span{flex:1;text-align:center;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bnames span.me{color:var(--primary);font-weight:600}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:0 0 8px}
td{padding-block:10px;border-top:1px solid var(--border)}
td.r,th.r{text-align:right}
tr.me td{font-weight:600}
tr.me td:first-child{color:var(--primary)}
.locked{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--bg)}
.locked .ghost{filter:blur(7px);opacity:.7;padding:24px;pointer-events:none;user-select:none;display:flex;flex-direction:column;gap:12px}
.locked .ghost .ln{height:12px;border-radius:999px;background:var(--border)}
.locked .over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;background:color-mix(in srgb,var(--bg) 40%,transparent)}
.locked .over .lk{width:40px;height:40px;border-radius:999px;background:var(--primary-bg);color:var(--primary);display:grid;place-items:center;font-size:18px}
.locked .over b{font-size:16px}
.plans{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:768px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{border:1px solid var(--border);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.plan.best{border:2px solid var(--primary);padding:23px}
.plan ul{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.split{display:grid;gap:0;grid-template-columns:1fr}
.split .r{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px;gap:12px;padding-block:10px;border-top:1px solid var(--border);align-items:center}
.split .r:first-child{border-top:0}
.split .r>span:not(:first-child){text-align:center}
.yes{color:var(--good);font-weight:600} .no{color:var(--muted)} .part{color:var(--warn);font-weight:600}
.hide{display:none!important}
/* motion + new pieces */
.main.enter{animation:stepin .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes stepin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.85)}70%{transform:scale(1.04)}100%{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes ring{0%{r:7;opacity:.9}100%{r:22;opacity:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.hero{display:grid;gap:32px;grid-template-columns:1fr;align-items:center;padding-block:8px}
@media(min-width:1024px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.hero h1{font-size:clamp(30px,4.2vw,48px);line-height:1.08}
.hero h1 em{font-style:normal;color:var(--primary)}
.lead{font-size:16px;color:var(--muted);max-width:52ch}
.urlbox{display:flex;flex-wrap:wrap;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:8px}
.urlbox:focus-within{border-color:var(--primary)}
.urlbox input{flex:1 1 200px;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--text);padding:0 8px;height:48px}
.urlbox input:focus{outline:none}
.urlbox .btn{height:48px;padding:0 20px}
@media(max-width:639px){.urlbox .btn{flex:1}}
.ais{display:flex;flex-wrap:wrap;gap:8px}
.aip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 10px;background:var(--bg)}
.aip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chat{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:320px;min-width:0}
.chat-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bq{align-self:flex-end;background:var(--primary-bg);border-radius:12px 12px 4px 12px;padding:8px 12px;max-width:88%;font-weight:500}
.ba{background:var(--surface);border-radius:12px 12px 12px 4px;padding:12px;max-width:100%;font-size:13px;line-height:1.6;min-height:84px}
.ba b{font-weight:600;color:var(--text)}
.ba mark{background:var(--good-bg);color:var(--good);border-radius:4px;padding:0 3px;font-weight:600}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.caret{display:inline-block;width:2px;height:1em;background:var(--primary);margin-left:1px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
.verdict{animation:pop .35s ease both;align-self:flex-start}
.scanhero{display:flex;align-items:center;gap:16px}
.ringp{flex:0 0 auto}
.ringp circle{fill:none;stroke-width:6}

.status{font-size:16px;color:var(--muted);min-height:24px}

.prs{display:flex;flex-direction:column}

.pr .v .badge{animation:pop .35s ease both}
